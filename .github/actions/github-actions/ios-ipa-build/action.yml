name: React Native iOS IPA Build
description: Archive and export a signed iOS IPA for device distribution

inputs:
  working-directory:
    description: Project root (contains ios/ after prebuild)
    required: false
    default: '.'
  scheme:
    description: Xcode scheme
    required: true
  configuration:
    description: Xcode configuration
    required: false
    default: Release
  bundle-identifier:
    description: iOS bundle identifier
    required: true
  team-id:
    description: Apple Developer Team ID
    required: true
  certificate-p12-base64:
    description: Base64-encoded .p12 distribution certificate
    required: true
  certificate-password:
    description: Password for the .p12 certificate
    required: true
  provisioning-profile-base64:
    description: Base64-encoded .mobileprovision (Ad Hoc / Enterprise)
    required: true
  export-method:
    description: exportOptions method (ad-hoc, enterprise, development, app-store)
    required: false
    default: ad-hoc
  keychain-password:
    description: Temporary CI keychain password
    required: false
    default: 'kakaobank-ci-keychain'
  derived-data-path:
    description: DerivedData path relative to working-directory
    required: false
    default: build/ios/DerivedData
  artifact-prefix:
    description: Prefix for artifact naming
    required: false
    default: rn-ios-ipa
  custom-identifier:
    description: Optional stable identifier
    required: false
  artifact-retention-days:
    description: GitHub artifact retention
    required: false
    default: '14'
  upload-artifact:
    description: Whether to upload the IPA as a GitHub Actions artifact
    required: false
    default: 'true'

outputs:
  artifact-name:
    description: Uploaded artifact name
    value: ${{ steps.names.outputs.artifact_name }}
  artifact-id:
    description: Uploaded artifact id
    value: ${{ steps.upload.outputs.artifact-id }}
  artifact-url:
    description: Uploaded artifact URL
    value: ${{ steps.upload.outputs.artifact-url }}
  ipa-path:
    description: Absolute path to the exported IPA
    value: ${{ steps.export.outputs.ipa_path }}

runs:
  using: composite
  steps:
    - name: Resolve iOS project settings
      id: resolve
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail

        CONFIG_JSON="$(npx react-native config)"
        IOS_SOURCE_DIR="$(printf '%s' "$CONFIG_JSON" | node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync(0,'utf8'));process.stdout.write(j.project?.ios?.sourceDir || 'ios')")"

        WORKSPACE="$(find "$IOS_SOURCE_DIR" -maxdepth 2 -name '*.xcworkspace' ! -path '*/Pods/*' | head -n1 || true)"
        PROJECT="$(find "$IOS_SOURCE_DIR" -maxdepth 2 -name '*.xcodeproj' ! -path '*/Pods/*' | head -n1 || true)"

        if [[ -n "$WORKSPACE" ]]; then
          CONTAINER_KIND="workspace"
          CONTAINER_PATH="$WORKSPACE"
        elif [[ -n "$PROJECT" ]]; then
          CONTAINER_KIND="project"
          CONTAINER_PATH="$PROJECT"
        else
          echo "Could not find .xcworkspace or .xcodeproj under $IOS_SOURCE_DIR"
          exit 1
        fi

        IDENTIFIER="${{ inputs.custom-identifier }}"
        if [[ -z "$IDENTIFIER" ]]; then
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            IDENTIFIER="pr-${{ github.event.pull_request.number }}"
          else
            IDENTIFIER="${GITHUB_SHA::7}"
          fi
        fi

        echo "ios_source_dir=$IOS_SOURCE_DIR" >> "$GITHUB_OUTPUT"
        echo "container_kind=$CONTAINER_KIND" >> "$GITHUB_OUTPUT"
        echo "container_path=$CONTAINER_PATH" >> "$GITHUB_OUTPUT"
        echo "identifier=$IDENTIFIER" >> "$GITHUB_OUTPUT"
        echo "Resolved iOS container ($CONTAINER_KIND): $CONTAINER_PATH"

    - name: Import signing certificate and profile
      id: signing
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        CERT_P12_BASE64: ${{ inputs.certificate-p12-base64 }}
        CERT_PASSWORD: ${{ inputs.certificate-password }}
        PROFILE_BASE64: ${{ inputs.provisioning-profile-base64 }}
        KEYCHAIN_PASSWORD: ${{ inputs.keychain-password }}
      run: |
        set -euo pipefail

        KEYCHAIN_PATH="$RUNNER_TEMP/kakaobank-signing.keychain-db"
        CERT_PATH="$RUNNER_TEMP/dist.p12"
        PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"

        echo "$CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"
        echo "$PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

        security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed -e s/\"//g)
        security default-keychain -s "$KEYCHAIN_PATH"

        security import "$CERT_PATH" \
          -P "$CERT_PASSWORD" \
          -A \
          -t cert \
          -f pkcs12 \
          -k "$KEYCHAIN_PATH"
        security set-key-partition-list \
          -S apple-tool:,apple: \
          -s \
          -k "$KEYCHAIN_PASSWORD" \
          "$KEYCHAIN_PATH"

        PROFILE_PLIST="$RUNNER_TEMP/profile.plist"
        security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
        PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print UUID' "$PROFILE_PLIST")"
        PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print Name' "$PROFILE_PLIST")"

        mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
        cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"

        echo "profile_uuid=$PROFILE_UUID" >> "$GITHUB_OUTPUT"
        echo "profile_name=$PROFILE_NAME" >> "$GITHUB_OUTPUT"
        echo "keychain_path=$KEYCHAIN_PATH" >> "$GITHUB_OUTPUT"
        echo "Installed provisioning profile: $PROFILE_NAME ($PROFILE_UUID)"

        rm -f "$CERT_PATH"

    - name: Write ExportOptions.plist
      id: export-options
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        EXPORT_METHOD: ${{ inputs.export-method }}
        TEAM_ID: ${{ inputs.team-id }}
        BUNDLE_ID: ${{ inputs.bundle-identifier }}
        PROFILE_NAME: ${{ steps.signing.outputs.profile_name }}
      run: |
        set -euo pipefail

        EXPORT_PLIST="$(pwd)/build/ios/ExportOptions.plist"
        mkdir -p "$(dirname "$EXPORT_PLIST")"

        # Prefer Python plistlib — PlistBuddy treats dots in bundle ids as paths.
        python3 - <<'PY'
        import os
        import plistlib
        from pathlib import Path

        path = Path(os.environ["PWD"]) / "build/ios/ExportOptions.plist"
        data = {
            "method": os.environ["EXPORT_METHOD"],
            "teamID": os.environ["TEAM_ID"],
            "signingStyle": "manual",
            "compileBitcode": False,
            "stripSwiftSymbols": True,
            "provisioningProfiles": {
                os.environ["BUNDLE_ID"]: os.environ["PROFILE_NAME"],
            },
        }
        path.write_bytes(plistlib.dumps(data))
        print(path.read_text())
        PY

        echo "export_plist=$EXPORT_PLIST" >> "$GITHUB_OUTPUT"
        echo "----- ExportOptions.plist -----"
        cat "$EXPORT_PLIST"

    - name: Archive iOS app
      id: archive
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail

        if [[ "${{ steps.resolve.outputs.container_kind }}" == "workspace" ]]; then
          XCODE_CONTAINER=( -workspace "${{ steps.resolve.outputs.container_path }}" )
        else
          XCODE_CONTAINER=( -project "${{ steps.resolve.outputs.container_path }}" )
        fi

        ARCHIVE_PATH="$(pwd)/build/ios/${{ inputs.scheme }}.xcarchive"
        mkdir -p "$(dirname "$ARCHIVE_PATH")"

        xcodebuild archive \
          "${XCODE_CONTAINER[@]}" \
          -scheme "${{ inputs.scheme }}" \
          -configuration "${{ inputs.configuration }}" \
          -sdk iphoneos \
          -destination "generic/platform=iOS" \
          -archivePath "$ARCHIVE_PATH" \
          -derivedDataPath "${{ inputs.derived-data-path }}" \
          COMPILER_INDEX_STORE_ENABLE=NO \
          CODE_SIGN_STYLE=Manual \
          DEVELOPMENT_TEAM="${{ inputs.team-id }}" \
          PROVISIONING_PROFILE_SPECIFIER="${{ steps.signing.outputs.profile_name }}" \
          CODE_SIGN_IDENTITY="Apple Distribution" \
          OTHER_CODE_SIGN_FLAGS="--keychain ${{ steps.signing.outputs.keychain_path }}"

        echo "archive_path=$ARCHIVE_PATH" >> "$GITHUB_OUTPUT"
        echo "Archived: $ARCHIVE_PATH"

    - name: Export IPA
      id: export
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail

        EXPORT_DIR="$(pwd)/build/ios/ipa"
        mkdir -p "$EXPORT_DIR"

        xcodebuild -exportArchive \
          -archivePath "${{ steps.archive.outputs.archive_path }}" \
          -exportPath "$EXPORT_DIR" \
          -exportOptionsPlist "${{ steps.export-options.outputs.export_plist }}"

        IPA_PATH="$(find "$EXPORT_DIR" -type f -name '*.ipa' | sort | head -n1 || true)"
        if [[ -z "$IPA_PATH" ]]; then
          echo "No IPA found in $EXPORT_DIR"
          find "$EXPORT_DIR" -type f || true
          exit 1
        fi

        IPA_ABS="$(cd "$(dirname "$IPA_PATH")" && pwd)/$(basename "$IPA_PATH")"
        echo "ipa_path=$IPA_ABS" >> "$GITHUB_OUTPUT"
        echo "Exported IPA: $IPA_ABS"
        ls -lh "$IPA_ABS"

    - name: Build artifact name
      id: names
      shell: bash
      run: |
        set -euo pipefail
        METHOD="$(echo "${{ inputs.export-method }}" | tr '[:upper:]' '[:lower:]' | tr ' ' '-')"
        NAME="${{ inputs.artifact-prefix }}-${METHOD}-${{ steps.resolve.outputs.identifier }}"
        echo "artifact_name=$NAME" >> "$GITHUB_OUTPUT"

    - name: Upload artifact
      id: upload
      if: ${{ inputs.upload-artifact == 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.names.outputs.artifact_name }}
        path: ${{ steps.export.outputs.ipa_path }}
        if-no-files-found: error
        retention-days: ${{ inputs.artifact-retention-days }}

    - name: Cleanup keychain
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        KEYCHAIN_PATH="${{ steps.signing.outputs.keychain_path }}"
        if [[ -n "${KEYCHAIN_PATH:-}" && -f "$KEYCHAIN_PATH" ]]; then
          security delete-keychain "$KEYCHAIN_PATH" || true
        fi
        rm -f "$RUNNER_TEMP/dist.p12" "$RUNNER_TEMP/profile.mobileprovision" "$RUNNER_TEMP/profile.plist" || true
