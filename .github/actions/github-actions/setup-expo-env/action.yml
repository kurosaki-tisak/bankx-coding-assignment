name: Setup Expo public env
description: Validate EXPO_PUBLIC_* secrets and write KakaoBankApp/.env for CI builds

inputs:
  working-directory:
    description: Expo app root (where .env should be written)
    required: false
    default: KakaoBankApp
  expo_public_firebase_api_key:
    required: true
  expo_public_firebase_auth_domain:
    required: true
  expo_public_firebase_project_id:
    required: true
  expo_public_firebase_storage_bucket:
    required: true
  expo_public_firebase_messaging_sender_id:
    required: true
  expo_public_firebase_app_id:
    required: true
  expo_public_firestore_secret_collection:
    required: true
  expo_public_firestore_secret_document:
    required: true
  expo_public_firestore_secret_field:
    required: true

runs:
  using: composite
  steps:
    - name: Validate and write .env
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        EXPO_PUBLIC_FIREBASE_API_KEY: ${{ inputs.expo_public_firebase_api_key }}
        EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ inputs.expo_public_firebase_auth_domain }}
        EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ inputs.expo_public_firebase_project_id }}
        EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ inputs.expo_public_firebase_storage_bucket }}
        EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ inputs.expo_public_firebase_messaging_sender_id }}
        EXPO_PUBLIC_FIREBASE_APP_ID: ${{ inputs.expo_public_firebase_app_id }}
        EXPO_PUBLIC_FIRESTORE_SECRET_COLLECTION: ${{ inputs.expo_public_firestore_secret_collection }}
        EXPO_PUBLIC_FIRESTORE_SECRET_DOCUMENT: ${{ inputs.expo_public_firestore_secret_document }}
        EXPO_PUBLIC_FIRESTORE_SECRET_FIELD: ${{ inputs.expo_public_firestore_secret_field }}
      run: |
        set -euo pipefail

        node <<'NODE'
        const fs = require('fs');
        const path = require('path');

        const KEYS = [
          'EXPO_PUBLIC_FIREBASE_API_KEY',
          'EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN',
          'EXPO_PUBLIC_FIREBASE_PROJECT_ID',
          'EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET',
          'EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID',
          'EXPO_PUBLIC_FIREBASE_APP_ID',
          'EXPO_PUBLIC_FIRESTORE_SECRET_COLLECTION',
          'EXPO_PUBLIC_FIRESTORE_SECRET_DOCUMENT',
          'EXPO_PUBLIC_FIRESTORE_SECRET_FIELD',
        ];

        const missing = [];
        const lines = [];

        for (const key of KEYS) {
          const raw = process.env[key];
          const value = typeof raw === 'string' ? raw.trim() : '';
          if (!value) {
            missing.push(key);
            continue;
          }
          lines.push(`${key}=${value.replace(/\r?\n/g, '')}`);
        }

        if (missing.length > 0) {
          console.error('::error::Missing or empty GitHub Actions secrets:');
          for (const key of missing) {
            console.error(`::error::  - ${key}`);
          }
          console.error(
            'Add them under Repository Settings → Secrets and variables → Actions.',
          );
          console.error(
            'Empty secret values also fail this check. Fork PRs cannot read repo secrets.',
          );
          process.exit(1);
        }

        const envPath = path.join(process.cwd(), '.env');
        fs.writeFileSync(envPath, `${lines.join('\n')}\n`, 'utf8');

        const written = fs.readFileSync(envPath, 'utf8');
        const keysOnly = written
          .trim()
          .split('\n')
          .map((line) => line.split('=')[0])
          .filter(Boolean);

        console.log(`Wrote ${envPath} (${keysOnly.length} keys)`);
        for (const key of keysOnly) {
          console.log(`  ${key}=***`);
        }

        if (!/^EXPO_PUBLIC_FIREBASE_API_KEY=.+$/m.test(written)) {
          console.error(
            '::error::EXPO_PUBLIC_FIREBASE_API_KEY is empty after writing .env',
          );
          process.exit(1);
        }
        NODE
