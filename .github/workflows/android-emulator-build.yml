# Build KakaoBankApp Android APK with `npx expo prebuild`,
# then upload it as a GitHub Actions artifact (emulator / sideload).
#
# Required GitHub Secrets (same EXPO_PUBLIC_* set as iOS / Firebase workflows):
#   EXPO_PUBLIC_FIREBASE_API_KEY
#   EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN
#   EXPO_PUBLIC_FIREBASE_PROJECT_ID
#   EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET
#   EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
#   EXPO_PUBLIC_FIREBASE_APP_ID
#   EXPO_PUBLIC_FIRESTORE_SECRET_COLLECTION
#   EXPO_PUBLIC_FIRESTORE_SECRET_DOCUMENT
#   EXPO_PUBLIC_FIRESTORE_SECRET_FIELD
#
# Download after a run:
#   gh run list --workflow "Android Emulator Build" --limit 5
#   gh run download <run-id> -n <artifact-name> -D ./artifacts

name: Android Emulator Build

on:
  workflow_dispatch:
    inputs:
      android_variant:
        description: Gradle assemble variant
        required: true
        default: Debug
        type: choice
        options:
          - Debug
          - Release
      artifact_retention_days:
        description: Artifact retention days
        required: true
        default: '7'
        type: string
  push:
    tags:
      - 'v*'

concurrency:
  group: android-emulator-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  ANDROID_VARIANT: Debug
  ARTIFACT_RETENTION_DAYS: '7'

jobs:
  android:
    name: Android → Artifact
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: KakaoBankApp
    env:
      EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
      EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
      EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}
      EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}
      EXPO_PUBLIC_FIRESTORE_SECRET_COLLECTION: ${{ secrets.EXPO_PUBLIC_FIRESTORE_SECRET_COLLECTION }}
      EXPO_PUBLIC_FIRESTORE_SECRET_DOCUMENT: ${{ secrets.EXPO_PUBLIC_FIRESTORE_SECRET_DOCUMENT }}
      EXPO_PUBLIC_FIRESTORE_SECRET_FIELD: ${{ secrets.EXPO_PUBLIC_FIRESTORE_SECRET_FIELD }}
    outputs:
      artifact_name: ${{ steps.build.outputs.artifact-name }}
      artifact_id: ${{ steps.build.outputs.artifact-id }}
      artifact_url: ${{ steps.build.outputs.artifact-url }}
      apk_path: ${{ steps.build.outputs.apk-path }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: KakaoBankApp/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm dependencies
        run: npm ci

      - name: Validate Expo secrets
        run: |
          set -euo pipefail
          missing=0
          for key in \
            EXPO_PUBLIC_FIREBASE_API_KEY \
            EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN \
            EXPO_PUBLIC_FIREBASE_PROJECT_ID \
            EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET \
            EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID \
            EXPO_PUBLIC_FIREBASE_APP_ID \
            EXPO_PUBLIC_FIRESTORE_SECRET_COLLECTION \
            EXPO_PUBLIC_FIRESTORE_SECRET_DOCUMENT \
            EXPO_PUBLIC_FIRESTORE_SECRET_FIELD
          do
            if [ -z "${!key:-}" ]; then
              echo "::error::Missing GitHub Actions secret: ${key}"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add the missing secrets under Repository Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "All required EXPO_PUBLIC_* secrets are present."

      - name: Write .env from GitHub Secrets
        run: |
          set -euo pipefail
          {
            echo "EXPO_PUBLIC_FIREBASE_API_KEY=${EXPO_PUBLIC_FIREBASE_API_KEY}"
            echo "EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN=${EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN}"
            echo "EXPO_PUBLIC_FIREBASE_PROJECT_ID=${EXPO_PUBLIC_FIREBASE_PROJECT_ID}"
            echo "EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET=${EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET}"
            echo "EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}"
            echo "EXPO_PUBLIC_FIREBASE_APP_ID=${EXPO_PUBLIC_FIREBASE_APP_ID}"
            echo "EXPO_PUBLIC_FIRESTORE_SECRET_COLLECTION=${EXPO_PUBLIC_FIRESTORE_SECRET_COLLECTION}"
            echo "EXPO_PUBLIC_FIRESTORE_SECRET_DOCUMENT=${EXPO_PUBLIC_FIRESTORE_SECRET_DOCUMENT}"
            echo "EXPO_PUBLIC_FIRESTORE_SECRET_FIELD=${EXPO_PUBLIC_FIRESTORE_SECRET_FIELD}"
          } > .env
          echo "Wrote KakaoBankApp/.env ($(wc -l < .env) lines)"
          cut -d= -f1 .env
          if ! grep -q '^EXPO_PUBLIC_FIREBASE_API_KEY=.\+' .env; then
            echo "::error::EXPO_PUBLIC_FIREBASE_API_KEY is empty after writing .env"
            exit 1
          fi

      - name: Expo prebuild (Android)
        run: |
          set -euo pipefail
          npx expo prebuild --platform android --non-interactive --no-install
          node -e "
            const cfg = require('./app.config.js')();
            if (!cfg.extra?.EXPO_PUBLIC_FIREBASE_API_KEY) {
              console.error('app.config.js extra is missing EXPO_PUBLIC_FIREBASE_API_KEY');
              process.exit(1);
            }
            console.log('app.config extra contains Firebase keys');
          "
          test -d android
          echo "Generated android/ project:"
          ls -la android

      - name: Resolve Android inputs
        id: android-inputs
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "variant=${{ inputs.android_variant }}" >> "$GITHUB_OUTPUT"
            echo "retention=${{ inputs.artifact_retention_days }}" >> "$GITHUB_OUTPUT"
          else
            echo "variant=${{ env.ANDROID_VARIANT }}" >> "$GITHUB_OUTPUT"
            echo "retention=${{ env.ARTIFACT_RETENTION_DAYS }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Android APK
        id: build
        uses: ./.github/actions/github-actions/android-build
        with:
          working-directory: KakaoBankApp
          variant: ${{ steps.android-inputs.outputs.variant }}
          artifact-prefix: kakaobank-android
          artifact-retention-days: ${{ steps.android-inputs.outputs.retention }}
          upload-artifact: 'true'

      - name: Job summary
        working-directory: ${{ github.workspace }}
        run: |
          {
            echo "## Android Emulator Build"
            echo ""
            echo "- Variant: \`${{ steps.android-inputs.outputs.variant }}\`"
            echo "- Artifact name: \`${{ steps.build.outputs.artifact-name }}\`"
            echo "- Artifact id: \`${{ steps.build.outputs.artifact-id }}\`"
            echo "- APK path: \`${{ steps.build.outputs.apk-path }}\`"
            echo ""
            echo "Download:"
            echo "\`\`\`bash"
            echo "gh run download ${{ github.run_id }} -n ${{ steps.build.outputs.artifact-name }} -D ./artifacts"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
