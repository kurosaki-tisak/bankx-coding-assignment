# Build Android with `npx expo prebuild` on GitHub Actions,
# then upload the APK to Firebase App Distribution.
# Firebase Project ID: bankx-code-assignment
#
# Required GitHub Secrets:
#   EXPO_ENV_FILE                   — full KakaoBankApp/.env contents
#                                     (all EXPO_PUBLIC_* lines)
#   FIREBASE_SERVICE_ACCOUNT_JSON   — GCP service account JSON with
#                                     Firebase App Distribution Admin
#   FIREBASE_ANDROID_APP_ID         — 1:450615736950:android:005d5b9231c484eec93d57
#
# Optional:
#   FIREBASE_TESTER_GROUPS          — comma-separated groups (default: testers)

name: Firebase App Distribution (Android)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: firebase-app-distribution-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android → Firebase App Distribution
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: KakaoBankApp

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: KakaoBankApp/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm dependencies
        run: npm ci

      - name: Write .env from secret
        env:
          EXPO_ENV_FILE: ${{ secrets.EXPO_ENV_FILE }}
        run: |
          set -euo pipefail
          if [ -z "${EXPO_ENV_FILE}" ]; then
            echo "Missing GitHub secret EXPO_ENV_FILE (full KakaoBankApp .env contents)."
            exit 1
          fi
          printf '%s\n' "${EXPO_ENV_FILE}" > .env

      - name: Expo prebuild (Android)
        run: npx expo prebuild --platform android --non-interactive --no-install

      - name: Build release APK
        working-directory: KakaoBankApp/android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Locate APK
        id: apk
        run: |
          set -euo pipefail
          APK_PATH="$(find "${GITHUB_WORKSPACE}/KakaoBankApp/android/app/build/outputs/apk" -name '*.apk' -type f | head -n 1)"
          if [ -z "${APK_PATH}" ]; then
            echo "No APK found under android/app/build/outputs/apk"
            find "${GITHUB_WORKSPACE}/KakaoBankApp/android/app/build/outputs" -type f || true
            exit 1
          fi
          echo "path=${APK_PATH}" >> "${GITHUB_OUTPUT}"
          echo "Found APK: ${APK_PATH}"
          ls -lh "${APK_PATH}"

      - name: Resolve tester groups
        id: groups
        run: |
          GROUPS="${{ secrets.FIREBASE_TESTER_GROUPS }}"
          if [ -z "${GROUPS}" ]; then GROUPS="testers"; fi
          echo "value=${GROUPS}" >> "${GITHUB_OUTPUT}"

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          groups: ${{ steps.groups.outputs.value }}
          file: ${{ steps.apk.outputs.path }}
          releaseNotes: |
            KakaoBankApp Android (expo prebuild)
            Commit: ${{ github.sha }}
            Ref: ${{ github.ref_name }}
