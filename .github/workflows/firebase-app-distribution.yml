# Build Android with `npx expo prebuild` on GitHub Actions,
# then upload the APK to Firebase App Distribution.
# Firebase Project ID: bankx-code-assignment
#
# Required GitHub Secrets (Repository → Settings → Secrets and variables → Actions):
#
#   App / Expo (baked into JS bundle at build time):
#     EXPO_PUBLIC_FIREBASE_API_KEY
#     EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN
#     EXPO_PUBLIC_FIREBASE_PROJECT_ID
#     EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET
#     EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
#     EXPO_PUBLIC_FIREBASE_APP_ID
#     EXPO_PUBLIC_FIRESTORE_SECRET_COLLECTION   (e.g. secrets)
#     EXPO_PUBLIC_FIRESTORE_SECRET_DOCUMENT     (e.g. encryption)
#     EXPO_PUBLIC_FIRESTORE_SECRET_FIELD        (e.g. aesKey)
#
#   Accounts API URL is loaded at runtime from Firestore:
#     secrets/endpoint → field accounts
#
#   (in code, not secrets): ACCOUNTS_PER_PAGE, USER_DISPLAY_NAME
#     → src/features/accounts/data/models/accountConfig.ts
#
#   Firebase App Distribution:
#     FIREBASE_SERVICE_ACCOUNT_JSON
#     FIREBASE_ANDROID_APP_ID
#
# Tester group is fixed to "testers".

name: Firebase App Distribution (Android)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: firebase-app-distribution-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android → Firebase App Distribution
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: KakaoBankApp
    env:
      EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
      EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
      EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}
      EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}
      EXPO_PUBLIC_FIRESTORE_SECRET_COLLECTION: ${{ secrets.EXPO_PUBLIC_FIRESTORE_SECRET_COLLECTION }}
      EXPO_PUBLIC_FIRESTORE_SECRET_DOCUMENT: ${{ secrets.EXPO_PUBLIC_FIRESTORE_SECRET_DOCUMENT }}
      EXPO_PUBLIC_FIRESTORE_SECRET_FIELD: ${{ secrets.EXPO_PUBLIC_FIRESTORE_SECRET_FIELD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need recent history for release notes (up to 10 commits)
          fetch-depth: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: KakaoBankApp/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm dependencies
        run: npm ci

      - name: Validate Expo secrets
        run: |
          set -euo pipefail
          missing=0
          for key in \
            EXPO_PUBLIC_FIREBASE_API_KEY \
            EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN \
            EXPO_PUBLIC_FIREBASE_PROJECT_ID \
            EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET \
            EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID \
            EXPO_PUBLIC_FIREBASE_APP_ID \
            EXPO_PUBLIC_FIRESTORE_SECRET_COLLECTION \
            EXPO_PUBLIC_FIRESTORE_SECRET_DOCUMENT \
            EXPO_PUBLIC_FIRESTORE_SECRET_FIELD
          do
            if [ -z "${!key:-}" ]; then
              echo "::error::Missing GitHub Actions secret: ${key}"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add the missing secrets under Repository Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "All required EXPO_PUBLIC_* secrets are present."

      - name: Write .env from GitHub Secrets
        run: |
          set -euo pipefail
          {
            echo "EXPO_PUBLIC_FIREBASE_API_KEY=${EXPO_PUBLIC_FIREBASE_API_KEY}"
            echo "EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN=${EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN}"
            echo "EXPO_PUBLIC_FIREBASE_PROJECT_ID=${EXPO_PUBLIC_FIREBASE_PROJECT_ID}"
            echo "EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET=${EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET}"
            echo "EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}"
            echo "EXPO_PUBLIC_FIREBASE_APP_ID=${EXPO_PUBLIC_FIREBASE_APP_ID}"
            echo "EXPO_PUBLIC_FIRESTORE_SECRET_COLLECTION=${EXPO_PUBLIC_FIRESTORE_SECRET_COLLECTION}"
            echo "EXPO_PUBLIC_FIRESTORE_SECRET_DOCUMENT=${EXPO_PUBLIC_FIRESTORE_SECRET_DOCUMENT}"
            echo "EXPO_PUBLIC_FIRESTORE_SECRET_FIELD=${EXPO_PUBLIC_FIRESTORE_SECRET_FIELD}"
          } > .env
          echo "Wrote KakaoBankApp/.env ($(wc -l < .env) lines)"
          cut -d= -f1 .env
          # Fail fast if API key line is empty after write
          if ! grep -q '^EXPO_PUBLIC_FIREBASE_API_KEY=.\+' .env; then
            echo "::error::EXPO_PUBLIC_FIREBASE_API_KEY is empty after writing .env"
            exit 1
          fi

      - name: Expo prebuild (Android)
        run: |
          set -euo pipefail
          # app.config.js embeds EXPO_PUBLIC_* into expo.extra for runtime (expo-constants)
          npx expo prebuild --platform android --non-interactive --no-install
          # Sanity: ensure config resolved the API key into extra
          node -e "
            const cfg = require('./app.config.js')();
            if (!cfg.extra?.EXPO_PUBLIC_FIREBASE_API_KEY) {
              console.error('app.config.js extra is missing EXPO_PUBLIC_FIREBASE_API_KEY');
              process.exit(1);
            }
            console.log('app.config extra contains Firebase keys');
          "

      - name: Build release APK
        working-directory: KakaoBankApp/android
        run: |
          set -euo pipefail
          chmod +x gradlew
          # Job env + .env must be present so Metro / Expo can resolve EXPO_PUBLIC_*
          ./gradlew assembleRelease --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8"
          JAVA_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=1024m"

      - name: Locate APK
        id: apk
        run: |
          set -euo pipefail
          APK_PATH="$(find "${GITHUB_WORKSPACE}/KakaoBankApp/android/app/build/outputs/apk" -name '*.apk' -type f | head -n 1)"
          if [ -z "${APK_PATH}" ]; then
            echo "No APK found under android/app/build/outputs/apk"
            find "${GITHUB_WORKSPACE}/KakaoBankApp/android/app/build/outputs" -type f || true
            exit 1
          fi
          echo "path=${APK_PATH}" >> "${GITHUB_OUTPUT}"
          echo "Found APK: ${APK_PATH}"
          ls -lh "${APK_PATH}"

      - name: Build release notes from recent commits
        id: notes
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          {
            echo "Commit:"
            git log -n 10 --pretty=format:'- %s' --no-merges
            echo
          } > /tmp/release-notes.txt
          echo "notes<<EOF" >> "${GITHUB_OUTPUT}"
          cat /tmp/release-notes.txt >> "${GITHUB_OUTPUT}"
          echo "EOF" >> "${GITHUB_OUTPUT}"
          echo "----- release notes -----"
          cat /tmp/release-notes.txt

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          groups: testers
          file: ${{ steps.apk.outputs.path }}
          releaseNotes: |
            KakaoBankApp Android (expo prebuild)
            ${{ steps.notes.outputs.notes }}
            Ref: ${{ github.ref_name }}
