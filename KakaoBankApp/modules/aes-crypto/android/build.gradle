plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.aescrypto'
version = '0.1.0'

android {
  namespace "expo.modules.aescrypto"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
    checkReleaseBuilds false
  }
}
